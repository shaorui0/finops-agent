      runbook:
        - "验证：[只读] 查近几周 CPU 曲线，确认窗口稳定。"
        - "处置：改为定时任务；旧实例先停机 [可回滚]，稳定后再终止 [不可逆] [需人工审批]。"
        - "确认：作业按时完成，次月 BoxUsage:r6i.2xlarge 行消失。"
      prevention: |-
        控制：批处理标准模板默认临时运行。
