        - "处置：先不关机；先处理 GT04，之后再配置定时启停 [可回滚]。"
        - "确认：启停后对比按需费用与 SP 利用率。"
      prevention: |-
        控制：评审清单先看承诺利用率，再算停机收益。
        告警：alert:DevEnvironmentIdleRunning。
        节奏：每周看 waste_ratio。
    - id: GT12
