# Synthetic AWS account #3: a freight-tracking SaaS ("northwind"), eu-west-1, June 2026.
# FRESH held-out world for c0024. A full world (not an overlay). Preregistered: this file, including its ground_truth,
# is committed BEFORE the agent or the judge has ever run on it. See openspec/changes/c0024-fresh-heldout/.
#
# Test-server limits that shape this world (testenv/ is out of scope for this change, so they are kept, not fixed):
#   - launch templates are hard-coded to lt-web (ami-web-v12, m5.xlarge) and lt-ingest (ami-ingest-v7, c5.2xlarge)
#   - metric job labels come from metric profiles; this world renames them through scenario.job_labels (applied by eval/heldout.py)
#   - one Savings Plan, one NAT gateway, one region per account
account:
  id: "000000000000"
  region: eu-west-1
  period: {start: "2026-06-01", end: "2026-07-01"}   # 30 days = 720 h

