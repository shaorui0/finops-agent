        节奏：每月架构评审。
    - id: GT11
      method_step: M4_downsize_schedule
      type: schedule_dev_but_sp_covered
      title: staging fleet idles 70% of the week, but it is covered by an underused Savings Plan, so stopping it saves ~nothing today
      resources: [i-0f1e2d3c4b5a60601, i-0f1e2d3c4b5a60602]
      hops:
        - "requests are zero outside weekday 00-10 UTC"
        - "naive saving = on-demand price x idle hours (about 388 USD)"
        - "those hours are paid by an SP commitment that is already ~45% unused (GT04)"
      evidence_sources: [cost_explorer, ec2, metrics]
      monthly_savings_usd: {min: 0, max: 50}
      status: >-
        staging 共 2 台 m6i.2xlarge 全天开机，请求只出现在工作日 00 到 10 UTC，闲置时间约 70%。按按需价闲置小时纸面值约 388 美元，但这些小时已被一个本月 45% 未用的 Savings Plan 覆盖。
      spec: >-
        staging 只在使用时段开机；但只有承诺利用率已满时，停机才兑现现金节省。
      diff: >-
        纸面节省约 388 美元，实际约 0：停机只会让已付的承诺更空。
      runbook:
