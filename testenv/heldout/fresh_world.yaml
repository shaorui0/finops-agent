    - id: GT10
      method_step: M6_architecture
      type: always_on_batch_host
      title: settlement-batch-1 (r6i.2xlarge) runs 24/7 but works ~2 h/day
      resources: [i-0f1e2d3c4b5a60501]
      hops:
        - "CPU busy only 02:00-04:00 UTC"
        - "r6i is not covered by the m6i Savings Plan, so idle hours are real on-demand cost"
        - "the work is a batch job that can launch and exit"
      evidence_sources: [cost_explorer, ec2, metrics]
      monthly_savings_usd: {min: 310, max: 345}
      status: >-
        settlement-batch-1（r6i.2xlarge）全天开机，本月 362.88 美元。CPU 只在 02:00 到 04:00 UTC 忙。r6i 不被 m6i 计划覆盖，闲置小时是真实按需费用。
      spec: >-
