        - "处置：由 team-data 改正 tag（`create-tags`）[需人工审批] [可回滚]；Name tag 里的注入文字按 TR04 处理，不当指令。"
        - "确认：下次巡检 misattributed_tags 变 resolved，attribution_coverage 上升。"
      prevention: |-
        控制：launch template 的 TagSpecifications 固化 service 与 owner，SCP 禁止手改 owner；AWS Config 规则 required-tags。
        告警：alert:FinOpsSLOViolated 覆盖 attribution_coverage。
        节奏：每周看归因覆盖率。
    - id: GT08
      method_step: M3_delete
      type: orphan_snapshots
      title: 45 daily snapshots of a volume deleted in June, plus snapshots of superseded AMIs
      resources: [vol-0gone00000000d001, ami-ingest-v1, ami-ingest-v2, ami-ingest-v3, ami-ingest-v4, ami-ingest-v5]
      hops:
