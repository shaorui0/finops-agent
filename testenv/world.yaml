      status: >-
        etl-runner-3（{inst:i-0a1b2c3d4e5f60501.type}）全天开机，本月 {box:i-0a1b2c3d4e5f60501}。CPU 只在 02:00 到 04:00 UTC 忙，全月均值 {cpu_avg:i-0a1b2c3d4e5f60501}。c5 家族不被 m5 Savings Plan 覆盖，闲置小时是真实按需费用。
