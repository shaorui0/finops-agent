        {p:orphan_snapshot_series.count} 个每日快照（各 {p:orphan_snapshot_series.gb_each} GB）来自已删除的卷，lifecycle 策略 dlm-daily 仍按 tag backup=daily 生成。另有 {snapn:gt:GT08} 个快照属于未被任何启动模板引用的旧 AMI。合计每月 {snapvol:gt:GT08} 加 {snapvol:vol-0gone00000000d001}。
      spec: >-
        快照随源卷生命周期结束而清理；AMI 只保留被模板引用的版本。
      diff: >-
        孤儿快照系列 {snapvol:vol-0gone00000000d001}，旧 AMI 快照 {snapvol:gt:GT08}，可省 {sav:GT08}。注意不要碰 TR03 的在用 AMI。
      runbook:
        - "验证：[只读] `aws ec2 describe-snapshots --owner-ids self` 按 volume-id 过滤，并确认源卷不存在。"
        - "验证：[只读] `aws ec2 describe-launch-template-versions` 确认旧 AMI 不被任何模板引用。"
        - "处置：先改 DLM 策略的目标 tag 或停用策略，防止继续生成 [需人工审批]；再注销旧 AMI 并删快照 [不可逆] [需人工审批]。"
        - "确认：快照数量与 EBS:SnapshotUsage 成本行下降，TR03 的 AMI 仍在。"
      prevention: |-
        控制：删卷流程里同步移除 DLM 目标 tag；AMI 清理用 EC2 Image Builder 或 DLM 的 AMI 策略，按「未被引用且超过保留期」判定。
