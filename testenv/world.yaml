        控制：迁移任务模板里卷设为随实例终止删除；tag policy 要求 owner 与 expire-on。
        告警：alert:FinOpsSLOViolated 覆盖 orphan_max_age_days。
        节奏：每周看孤儿年龄；AWS Config 规则 ec2-volume-inuse-check。
    - id: GT10
