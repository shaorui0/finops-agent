        - "验证：[只读] `aws ec2 describe-volumes --filters Name=status,Values=available`。"
        - "验证：[只读] CloudTrail 找创建者，确认迁移已结束。"
        - "处置：需要安全网时先快照 [需人工审批]；然后删卷 [不可逆] [需人工审批]。"
        - "确认：卷与成本行消失，该 finding 变 resolved。"
