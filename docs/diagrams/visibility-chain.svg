bility.json -&gt; 报告 + 告警 CostVisibilityMetricMissing</p></span></div></foreignObject></g></g><g transform="translate(581, 65.75)" id="flowchart-RULE-6" class="node default"><polygon transform="translate(-134.875,45.75)" class="label-container" points="22.875,0 246.875,0 269.75,-45.75 246.875,-91.5 22.875,-91.5 0,-45.75"/><g transform="translate(-100, -33.75)" style="" class="label"><rect/><foreignObject height="67.5" width="200"><div style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span class="nodeLabel"><p>先目标，后看现有指标<br />FA12 以终为始：写环 1 时不得看 metric 列表</p></span></div></foreignObject></g></g><g transform="translate(492, 498)" id="flowchart-SC-7" class="node default"><rect height="138" width="296" y="-69" x="-148" style="" class="basic label-container"/><g transform="translate(-100, -45)" style="" class="label"><rect/><foreignObject height="90" width="200"><div style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span class="nodeLabel"><p>eval/score_visibility.py<br />LLM 推导的环 1 对照人工审阅版<br />recall, precision</p></span></div></foreignObject></g></g></g></g></g></svg>