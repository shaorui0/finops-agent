rule_files: [finops.rules.yml]
evaluation_interval: 1m

tests:
  - name: busy but useless fleet fires, healthy fleet does not
    interval: 1m
    input_series:
      - series: 'ingest_jobs_total{job="ingest-worker",status="succeeded"}'
        values: '100+0x120'
      - series: 'ingest_jobs_total{job="ingest-worker",status="failed"}'
        values: '0+5x120'
      - series: 'ingest_jobs_total{job="healthy-worker",status="succeeded"}'
        values: '0+5x120'
      - series: 'ingest_job_retries_total{job="ingest-worker"}'
        values: '0+25x120'
    alert_rule_test:
      - eval_time: 100m
        alertname: BusyButUselessFleet
        exp_alerts:
          - exp_labels: {severity: page, team: finops, job: ingest-worker}
            exp_annotations:
              summary: "ingest-worker is attempting work but nothing succeeds; its compute is waste until fixed"
              runbook: docs/FINOPS_SLO.md#busy-but-useless
      - eval_time: 100m
        alertname: RetryStorm
        exp_alerts:
          - exp_labels: {severity: ticket, team: finops, job: ingest-worker}
            exp_annotations:
              summary: "ingest-worker retries 5.0x per job; retries multiply compute, NAT and request costs"

  - name: SLO violation needs a full day; regression fires at once
    interval: 1m
    input_series:
      - series: 'finops_sli{sli="commitment_utilization",run="r1"}'
        values: '0.6x1700'
      - series: 'finops_slo_target{sli="commitment_utilization",op=">="}'
        values: '0.9x1700'
      - series: 'finops_sli{sli="waste_ratio",run="r1"}'
        values: '0.01x1700'
      - series: 'finops_slo_target{sli="waste_ratio",op="<="}'
        values: '0.05x1700'
      - series: 'finops_findings{state="regressed"}'
        values: '0x120 1x1580'
    alert_rule_test:
      - eval_time: 12h
        alertname: FinOpsSLOViolated
        exp_alerts: []
      - eval_time: 25h
        alertname: FinOpsSLOViolated
        exp_alerts:
          - exp_labels: {severity: ticket, team: finops, sli: commitment_utilization, run: r1}
            exp_annotations:
              summary: "FinOps SLO commitment_utilization violated for a day (value 0.6)"
              runbook: docs/FINOPS_SLO.md#slis
      - eval_time: 3h
        alertname: FinOpsRegression
        exp_alerts:
          - exp_labels: {severity: ticket, team: finops, state: regressed}
            exp_annotations:
              summary: "1 finding(s) came back after being resolved: the system is rotting"
              runbook: docs/FINOPS_SLO.md#rot

  - name: stale inspection
    interval: 1h
    input_series:
      - series: 'finops_last_run_timestamp_seconds'
        values: '0x100'
    alert_rule_test:
      - eval_time: 47h
        alertname: FinOpsInspectionStale
        exp_alerts: []
      - eval_time: 49h
        alertname: FinOpsInspectionStale
        exp_alerts:
          - exp_labels: {severity: ticket, team: finops}
            exp_annotations:
              summary: "No FinOps inspection run for 2d 1h 0m 0s"
              runbook: docs/FINOPS_SLO.md#cadence

  - name: waste burn
    interval: 1h
    input_series:
      - series: 'finops_waste_budget_usd'
        values: '300x200'
      - series: 'finops_waste_usd'
        values: '100x24 105x24 175x150'
    alert_rule_test:
      - eval_time: 30h
        alertname: FinOpsWasteFastBurn
        exp_alerts: []
      - eval_time: 50h
        alertname: FinOpsWasteFastBurn
        exp_alerts:
          - exp_labels: {severity: ticket, team: finops}
            exp_annotations:
              summary: "Open waste grew by $70 in a day, more than twice the daily budget"
              runbook: docs/FINOPS_SLO.md#waste-budget
