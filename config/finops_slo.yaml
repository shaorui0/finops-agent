# FinOps SLOs: what "cost-healthy" means, so that rot is detected instead of
# rediscovered at the next quarterly review. Each SLI is computed every run from
# the snapshot, the metrics and the previous run's state (see docs/FINOPS_SLO.md).
#
# op: ">=" means the value must stay at or above target; "<=" at or below.

slos:
  - id: waste_ratio
    unit: ratio
    what: 已有证据、尚未处理的浪费（账单口径）占花费的比例
    op: "<="
    target: 0.05
    budget: true            # the monthly waste budget is target x spend
    cadence: daily
  - id: attribution_coverage
    unit: ratio
    what: 带 owner tag 的花费占比
    op: ">="
    target: 0.90
    cadence: weekly
  - id: commitment_utilization
    unit: ratio
    what: 本周期 Savings Plan 利用率
    op: ">="
    target: 0.90
    cadence: monthly
  - id: orphan_max_age_days
    unit: days
    what: 最老的孤儿资源（未挂载卷、已删卷的快照）存在天数
    op: "<="
    target: 14
    cadence: weekly
  - id: anomaly_time_to_detect_days
    unit: days
    what: 成本异常开始到第一次被报出之间的天数
    op: "<="
    target: 1
    cadence: daily
  - id: useful_work_ratio
    unit: ratio
    what: 上报 job 结果的 fleet 中，成功的工作 / 尝试的工作
    op: ">="
    target: 0.95
    cadence: daily
  - id: visibility_coverage
    unit: ratio
    what: 可见性需求中被指标完全覆盖的比例
    op: ">="
    target: 1.0
    cadence: weekly
  - id: remediation_age_days
    unit: days
    what: 跨运行仍未关闭的最老发现的天数
    op: "<="
    target: 30
    cadence: weekly

burn_alerts:
  fast: {window: 1d, factor: 2.0}   # waste added in a day > 2x the daily budget
  slow: {window: 7d, factor: 1.0}   # waste added in a week > the weekly budget
