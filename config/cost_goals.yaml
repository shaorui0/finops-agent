# 这个账号的成本目标，只用业务语言写。
# 来源：docs/METHOD.md（M0-M6 与硬规则）、docs/FINOPS_SLO.md（SLO 取值）。
# 这里不出现任何 metric 名、标签名或 SLI 编号：从目标反推需要看到什么，是 LLM 要做的事。

account: |
  一个中等规模的 AWS 账号，月花费约 8.7 千美元，单区域。
  对外在线服务：web、api（有延迟 SLO，白天高峰、夜间低谷，潮汐明显）。
  开发环境：web-dev（只在工作时间有人用）。
  后台批处理：ingest-worker（持续摄入数据）、etl-runner（定时 ETL）。
  共享成本：NAT 网关出口流量、跨可用区数据传输、Savings Plan 承诺费用。
  监控系统是 Prometheus 风格的时序库；账单、资源清单、标签走 AWS API，不在时序库里。

goals:
  - id: G1
    目标: 已有证据、尚未处理的浪费，占总花费不超过 5%
    业务含义: 要能确定「没人在用」的资源并停掉或删除；证据必须覆盖账号里所有在运行的机器，不能只看一部分
  - id: G2
    目标: 机器看起来忙，但干的活是白干，这种情况必须能被发现；成功的工作 / 尝试的工作 ≥ 95%
    业务含义: CPU 高不等于有产出。下游出错时重试会把计算和流量一起放大，成本看着正常实际全是浪费
  - id: G3
    目标: 降配只在余量已知的前提下做，并且不砍掉对外服务的延迟 SLO 的保护余量
    业务含义: 水位对 SLO 负责；70% 只是个数字。降配前要知道每个资源维度（算力、内存等）还剩多少，以及这个余量在保护哪条 SLO
  - id: G4
    目标: 高峰用满低谷缩下来不算浪费；只有长期空闲或有明确空闲时段的环境才调度或缩容
    业务含义: 潮汐不是浪费。要能区分「按时段规律空闲」和「一直没人用」，区分依据是峰谷分布而不是单点利用率
  - id: G5
    目标: 承诺折扣（Savings Plan）利用率 ≥ 90%，并且在清理和降配之后才买新的
    业务含义: 被承诺覆盖的用量，停掉它省下的是承诺利用率，不是钱；算节省前要先知道覆盖关系
  - id: G6
    目标: 共享成本可以归因到造成它的服务：NAT 处理的流量归到发出流量的工作负载；跨可用区数据传输归到通信双方的服务
    业务含义: 目前大部分未归因花费是共享成本；没有归因规则，谁也不对这笔钱负责
  - id: G7
    目标: 单位工作的成本可以算出来，比如每个摄入 job、每处理一单位数据花多少钱
    业务含义: 把「花了多少」变成「值不值」；分母必须是真实完成的工作量
  - id: G8
    目标: 成本异常从开始到第一次被报出来 ≤ 1 天
    业务含义: 月底看账单发现 NAT 流量涨了五倍已经晚了；需要比账单更早的信号来触发巡检
  - id: G9
    目标: 带 owner 的花费占比 ≥ 90%；孤儿资源（卷、快照、IP）存在不超过 14 天
    业务含义: 归属和孤儿来自资源清单和标签，不是运行时指标
