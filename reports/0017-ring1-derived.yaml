# 第 ① 环，由 LLM 从 config/cost_goals.yaml 推出（未查看任何现有指标）。
# 由 `python3 -m finops_agent.visibility_llm derive` 生成，格式同 visibility_requirements.yaml。
slis:
- id: idle_resource_evidence
  decision: 判定哪些在运行的机器长期无人使用，从而停止或删除，且证据覆盖所有运行实例
  goals:
  - G1
  need:
  - signal: 每台运行实例的CPU利用率
    name: aws_ec2_cpuutilization.*
    scope: running_instances
  - signal: 每台运行实例的网络入向流量
    name: aws_ec2_network_in.*
    scope: running_instances
  - signal: 每台运行实例的网络出向流量
    name: aws_ec2_network_out.*
    scope: running_instances
- id: useful_work_ratio
  decision: 识别CPU高但产出为白干（重试放大）的服务，避免把浪费当成正常负载或错误地扩容
  goals:
  - G2
  need:
  - signal: 各服务成功完成的工作量计数
    name: .*(success|succeeded|completed|ok).*_total.*
    scope: services:web,api,ingest-worker,etl-runner
  - signal: 各服务尝试的工作量计数（含重试）
    name: .*(attempt|request|retry|retries).*_total.*
    scope: services:web,api,ingest-worker,etl-runner
- id: rightsizing_headroom_slo
  decision: 仅在各资源维度余量已知且不削弱对外服务延迟SLO保护余量时才降配
  goals:
  - G3
  need:
  - signal: 每台实例的CPU利用率（算力余量）
    name: aws_ec2_cpuutilization.*
    scope: running_instances
  - signal: 每台实例的内存使用率（内存余量）
    name: .*(mem_used_percent|memory_utilization|node_memory_MemAvailable_bytes|node_memory_MemTotal_bytes).*
    scope: running_instances
  - signal: 对外服务请求延迟分布（SLO保护余量）
    name: .*(request|http|latency).*duration.*(bucket|seconds).*
    scope: services:web,api
- id: tidal_idle_pattern
  decision: 区分潮汐式峰谷与长期空闲，仅对长期空闲或有固定空闲时段的环境做调度或缩容
  goals:
  - G4
  need:
  - signal: 各实例CPU利用率的长周期时间序列（用于峰谷分布）
    name: aws_ec2_cpuutilization.*
    scope: running_instances
  - signal: 开发与在线服务的请求量时间序列（判断是否有人使用及时段）
    name: .*(request|http_requests).*_total.*
    scope: services:web,api,web-dev
- id: shared_cost_attribution_traffic
  decision: 依据发出流量的工作负载及通信双方服务来归因NAT与跨可用区共享成本
  goals:
  - G6
  need:
  - signal: NAT网关处理的字节量
    name: aws_natgateway_bytes_out_to_destination.*|aws_natgateway_bytes_in_from_source.*|aws_natgateway_bytes_out_to_source.*|aws_natgateway_bytes_in_from_destination.*
    scope: nat_gateways
  - signal: 各服务发出的网络字节量（按服务/可用区）
    name: .*(network_transmit_bytes|bytes_sent|egress_bytes|tx_bytes).*
    scope: services:web,api,web-dev,ingest-worker,etl-runner
- id: unit_cost_denominator
  decision: 以真实完成的工作量作为分母计算单位成本，判断支出是否值得
  goals:
  - G7
  need:
  - signal: ingest-worker完成的job数/处理的数据量
    name: .*(ingest|job|processed).*(completed|success|records|bytes|total).*
    scope: services:ingest-worker
  - signal: etl-runner完成的job数/处理的数据量
    name: .*(etl|job|processed).*(completed|success|records|bytes|total).*
    scope: services:etl-runner
- id: cost_anomaly_early_signal
  decision: 在账单之前通过用量异常信号触发成本巡检，使异常在1天内被发现
  goals:
  - G8
  need:
  - signal: NAT网关出口流量（用量早期信号）
    name: aws_natgateway_bytes_out_to_destination.*
    scope: nat_gateways
  - signal: 实例CPU与网络用量突变信号
    name: aws_ec2_network_out.*
    scope: running_instances
not_metric_observable:
- goal: G5
  reason: Savings Plan利用率与覆盖关系来自AWS账单/Cost Explorer API，不是时序数据
- goal: G9
  reason: owner占比与孤儿资源年龄来自标签与资源清单，不是运行时指标
